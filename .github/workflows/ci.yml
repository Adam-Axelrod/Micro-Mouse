name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The renderer tests open a real display; a runner has no screen.
  SDL_VIDEODRIVER: dummy

jobs:
  tests:
    name: Suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python tests/run_all.py

  no-dependencies:
    name: Suite with nothing installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Pico has no pip, so the logic, hardware and health divisions must
      # pass on builtins alone. The sim division skips itself without pygame.
      - run: python tests/run_all.py logic hardware health

  modes:
    name: Headless modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Every mode the PC can run
        run: |
          python main.py --speed
          python main.py --step
          python main.py --maxspeed
          cp routes/lap3x3.mmc route.mmc
          python main.py --follow --map=mazes/test_mazes/blank3x3.num --laps=3
          # No --map: the world comes from the route header's own grid size.
          python main.py --follow --laps=2
          python main.py --soak --laps=3 --power=0.3
          test -s lap_soak.csv
          # Mode 5 must refuse a route that does not return to its start cell.
          cp routes/perimeter3x3.mmc route.mmc
          python main.py --soak --laps=3 | grep -q "REFUSING"

      - name: Trace a run, then replay it into the sim
        run: |
          python main.py --speed --log
          test -s motor_log.csv
          python sim/replay_log.py

      - name: Modes render without crashing
        run: |
          python main.py --speed --render
          python main.py --follow --map=mazes/test_mazes/blank3x3.num --render
          cp routes/lap3x3.mmc route.mmc
          python main.py --soak --laps=2 --render

      # Run as MODULES, not files: `python brain/maze.py` puts brain/ on the
      # path instead of the repository root, and the import fails.
      - name: Inline self-tests
        run: |
          for module in brain.maze brain.explorer brain.search_algorithms \
                        brain.commands record.motor_log; do
            python -m "$module"
          done
